packages:
  - 'shared/*'
  - 'widgets/*'
  - 'simulation'
  - 'react-app'


ignoredBuiltDependencies:
  - core-js

onlyBuiltDependencies: []

# pnpm 10 reads these settings from here, not from the "pnpm" field in package.json.
overrides:
  '@mendix/pluggable-widgets-tools': ^11.8.1
  '@types/react': ^19.2.15
  '@types/react-dom': ^19.2.3
  react: ^19.2.6
  react-dom: ^19.2.6
patchedDependencies:
  '@mendix/pluggable-widgets-tools@11.8.1': patches/@mendix__pluggable-widgets-tools@11.8.1.patch

peerDependencyRules:
  allowedVersions:
    react: ^19.2.6
    react-dom: ^19.2.6
  ignoreMissing:
    - react-native
