networks:
  amz-cowork-nwk:
    driver: bridge

# Three deployables. Each one can be down/up'd independently from Jenkins via
# `docker-compose up -d --force-recreate --no-deps <service-name>`, so a redeploy of one
# never bounces the others.
#
# External dependencies (MongoDB for SSO, etc.) are NOT defined here — point at them via
# the per-service .env files (e.g. deploy/.env.sso has MONGODB_URI). Keeps the compose file
# stateless and easy to swap between dev / staging / prod.
services:
  amz-cowork-app:
    image: ${DOCKERHUB_REPOSITORY:-registry.amoza.xyz}/ax-app:${IMAGE_TAG:-latest}
    container_name: amz-cowork-app_15000
    restart: unless-stopped
    env_file:
      - ./.env.app
    networks:
      - amz-cowork-nwk
    expose:
      - 15000
    ports:
      - '15000:15000'

  amz-cowork-sso:
    image: ${DOCKERHUB_REPOSITORY:-registry.amoza.xyz}/ax-sso:${IMAGE_TAG:-latest}
    container_name: amz-cowork-sso_15501
    restart: unless-stopped
    env_file:
      - ./.env.sso
    networks:
      - amz-cowork-nwk
    expose:
      - 15501
    ports:
      - '15501:15501'

  amz-cowork-di:
    image: ${DOCKERHUB_REPOSITORY:-registry.amoza.xyz}/ax-di:${IMAGE_TAG:-latest}
    container_name: amz-cowork-di_15001
    restart: unless-stopped
    env_file:
      - ./.env.di
    networks:
      - amz-cowork-nwk
    expose:
      - 15001
    ports:
      - '15001:15001'
