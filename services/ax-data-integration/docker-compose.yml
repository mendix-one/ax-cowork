# docker-compose template for ax-data-integration.
#
# Two modes (T2-A11):
#
#   1. Default — env-var master key (dev velocity):
#        cp .env.compose.example .env
#        # edit .env: set INTEGRATION_MASTER_KEY_V1 = `openssl rand -base64 32`
#        docker compose up --build
#
#   2. `prod` profile — Docker secret master key (key never touches .env):
#        mkdir -p secrets
#        openssl rand -base64 32 > secrets/master_key_v1.txt
#        chmod 400 secrets/master_key_v1.txt
#        docker compose --profile prod up --build
#
# The `prod` profile and the default service share the same image + Mongo. They use
# distinct container names + host ports so they cannot accidentally co-exist on the
# same port. Pick one mode and stick with it — do NOT mix them in one shell.
#
# Build context is the repo root (two levels up) because the pnpm workspace + shared
# packages live above this folder.

services:
  mongo:
    image: mongo:7
    container_name: ax-di-mongo
    restart: unless-stopped
    ports:
      - '${MONGO_HOST_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # `mongosh --eval` ships in the official image; ping is cheap.
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ax-data-integration:
    # Default profile (no `profiles:` entry) — env-var master key. This is the
    # dev-velocity path: `.env` carries every secret, no extra files needed.
    build:
      context: ../..
      dockerfile: services/ax-data-integration/Dockerfile
    image: ax-data-integration:local
    container_name: ax-di-service
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${SERVICE_HOST_PORT:-3012}:3012'
    environment:
      NODE_ENV: production
      PORT: 3012
      LOG_LEVEL: ${LOG_LEVEL:-info}

      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-ax_data_integration}
      MONGO_POOL_SIZE: ${MONGO_POOL_SIZE:-10}

      INTEGRATION_API_KEYS: ${INTEGRATION_API_KEYS:?set INTEGRATION_API_KEYS in .env}
      INTEGRATION_MASTER_KEY_V1: ${INTEGRATION_MASTER_KEY_V1:?set INTEGRATION_MASTER_KEY_V1 in .env (openssl rand -base64 32)}
      INTEGRATION_MASTER_KEY_CURRENT: ${INTEGRATION_MASTER_KEY_CURRENT:-1}

      INTEGRATION_DEFAULT_TIMEZONE: ${INTEGRATION_DEFAULT_TIMEZONE:-UTC}
      INTEGRATION_DEFAULT_ERROR_THRESHOLD: ${INTEGRATION_DEFAULT_ERROR_THRESHOLD:-100}
      INTEGRATION_MAX_CONCURRENT_RUNS: ${INTEGRATION_MAX_CONCURRENT_RUNS:-5}
      INTEGRATION_HEARTBEAT_INTERVAL_MS: ${INTEGRATION_HEARTBEAT_INTERVAL_MS:-30000}
      INTEGRATION_STALE_HEARTBEAT_TIMEOUT_MS: ${INTEGRATION_STALE_HEARTBEAT_TIMEOUT_MS:-120000}
      INTEGRATION_STALE_SWEEP_INTERVAL_MS: ${INTEGRATION_STALE_SWEEP_INTERVAL_MS:-60000}
      INTEGRATION_CHANGELOG_BUFFER_SIZE: ${INTEGRATION_CHANGELOG_BUFFER_SIZE:-100}

  ax-data-integration-prod:
    # T2-A11 — `prod` profile: master key is loaded from `/run/secrets/master_key_v1`
    # (Docker secret). The plain `INTEGRATION_MASTER_KEY_V1` env var is NOT set here —
    # `loadMasterKeyRing` refuses to boot if both env + file are set for the same version.
    #
    # Vault Agent migration path: have Vault Agent write the secret to the same host
    # path (`./secrets/master_key_v1.txt`) — no service / compose change needed.
    profiles: [prod]
    build:
      context: ../..
      dockerfile: services/ax-data-integration/Dockerfile
    image: ax-data-integration:local
    container_name: ax-di-service-prod
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${SERVICE_HOST_PORT_PROD:-3013}:3012'
    environment:
      NODE_ENV: production
      PORT: 3012
      LOG_LEVEL: ${LOG_LEVEL:-info}

      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-ax_data_integration}
      MONGO_POOL_SIZE: ${MONGO_POOL_SIZE:-10}

      INTEGRATION_API_KEYS: ${INTEGRATION_API_KEYS:?set INTEGRATION_API_KEYS in .env}
      INTEGRATION_MASTER_KEY_V1_FILE: /run/secrets/master_key_v1
      INTEGRATION_MASTER_KEY_CURRENT: ${INTEGRATION_MASTER_KEY_CURRENT:-1}

      INTEGRATION_DEFAULT_TIMEZONE: ${INTEGRATION_DEFAULT_TIMEZONE:-UTC}
      INTEGRATION_DEFAULT_ERROR_THRESHOLD: ${INTEGRATION_DEFAULT_ERROR_THRESHOLD:-100}
      INTEGRATION_MAX_CONCURRENT_RUNS: ${INTEGRATION_MAX_CONCURRENT_RUNS:-5}
      INTEGRATION_HEARTBEAT_INTERVAL_MS: ${INTEGRATION_HEARTBEAT_INTERVAL_MS:-30000}
      INTEGRATION_STALE_HEARTBEAT_TIMEOUT_MS: ${INTEGRATION_STALE_HEARTBEAT_TIMEOUT_MS:-120000}
      INTEGRATION_STALE_SWEEP_INTERVAL_MS: ${INTEGRATION_STALE_SWEEP_INTERVAL_MS:-60000}
      INTEGRATION_CHANGELOG_BUFFER_SIZE: ${INTEGRATION_CHANGELOG_BUFFER_SIZE:-100}
    secrets:
      - master_key_v1

secrets:
  master_key_v1:
    # File source — operator places the base64-encoded master key here before
    # `docker compose --profile prod up`. Mounted at /run/secrets/master_key_v1
    # with mode 0444 by the compose runtime.
    file: ./secrets/master_key_v1.txt

volumes:
  mongo-data:
    name: ax-di-mongo-data
